<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Documentos</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .btn {
            display: block;
            width: 250px;
            padding: 10px;
            margin: 10px 0;
            text-decoration: none;
            background: #1976d2;
            color: white;
            text-align: center;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<h1 id="titulo"></h1>

<p>
    <b>Cliente:</b>
    <span id="cliente"></span>
</p>

<p>
    <b>Fecha:</b>
    <span id="fecha"></span>
</p>

<div id="archivos">

</div>

<script>

const params = new URLSearchParams(window.location.search);

const documento = params.get("doc");

fetch(`data/${documento}.json`)
.then(res => res.json())
.then(data => {

    document.getElementById("titulo").innerText =
        "Documento " + data.documento;

    document.getElementById("cliente").innerText =
        data.cliente;

    document.getElementById("fecha").innerText =
        data.fecha;

    const div = document.getElementById("archivos");

    data.archivos.forEach(a => {

        const link = document.createElement("a");

        link.href = a.url;

        link.className = "btn";

        link.innerText = a.nombre;

        link.target = "_blank";

        div.appendChild(link);
    });
});

</script>

</body>
</html>
